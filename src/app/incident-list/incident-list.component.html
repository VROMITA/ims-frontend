<h2>INCIDENT TABLE</h2>

<table mat-table [dataSource]="incidents">
<ng-container matColumnDef="id">
  <th mat-header-cell *matHeaderCellDef>ID</th>
  <td mat-cell *matCellDef="let incident">{{ incident.id }}</td>
</ng-container>
<ng-container matColumnDef="title">
  <th mat-header-cell *matHeaderCellDef>Title</th>
  <td mat-cell *matCellDef="let incident">{{ incident.title }}</td>
</ng-container>
<ng-container matColumnDef="priority">
  <th mat-header-cell *matHeaderCellDef>Priority</th>
  <td mat-cell *matCellDef="let incident">{{ incident.priority }}</td>
</ng-container>
<ng-container matColumnDef="status">
  <th mat-header-cell *matHeaderCellDef>Status</th>
  <td mat-cell *matCellDef="let incident">{{ incident.status }}</td>
</ng-container>
<ng-container matColumnDef="assignedTeam">
  <th mat-header-cell *matHeaderCellDef>Assigned Team</th>
  <td mat-cell *matCellDef="let incident">{{ incident.assignedTeam}}</td>
</ng-container>


  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

</table>
